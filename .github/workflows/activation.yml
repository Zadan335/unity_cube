name: Unity Android Build (GameCI - 2022.3 LTS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    env:
      UNITY_VERSION: 2022.3.62f3

    steps:
      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Cache (IMPORTANT for speed + stability)
      # -----------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: |
            Library
            Library/Bee
            Library/ArtifactDB
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # -----------------------------
      # 3. Free memory (helps SIGKILL 137)
      # -----------------------------
      - name: System Cleanup
        run: |
          sudo purge || true

      # -----------------------------
      # 4. Build with GameCI
      # -----------------------------
      - name: Build Android (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:
          projectPath: .
          unityVersion: 2022.3.62f3
          targetPlatform: Android

          buildMethod: BuildScript.BuildAndroid
          allowDirtyBuild: true

          # =========================
          # OUTPUT TYPE (choose ONE)
          # =========================

          androidAppBundle: false   # APK (testing)
          # androidAppBundle: true  # AAB (Play Store)

          # -------------------------
          # KEYS STORE CONFIG
          # -------------------------
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      # -----------------------------
      # 5. Upload logs (critical debugging)
      # -----------------------------
      - name: Upload Unity Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            **/*.log

      # -----------------------------
      # 6. Upload APK / AAB
      # -----------------------------
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/*.apk
            **/*.aab
