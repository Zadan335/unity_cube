name: Unity Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Debug
      - name: Debug Workspace
        run: |
          pwd
          ls -la
          ls Assets Packages ProjectSettings || echo "Not Unity project"

      # 3. Find Unity (dynamic safe)
      - name: Locate Unity
        id: unity
        run: |
          UNITY_PATH=$(find /Applications/Unity/Hub/Editor -name Unity -type f | head -n 1)
          echo "UNITY_PATH=$UNITY_PATH" >> $GITHUB_ENV
          echo "Found Unity: $UNITY_PATH"

      # 4. Build using Rosetta (FIX FOR YOUR CRASH)
      - name: Build Android (Rosetta Intel Mode)
        run: |
          arch -x86_64 "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod BuildScript.BuildAndroid \
            -quit \
            -logFile unity_build.log

      # 5. Upload logs
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: unity_build.log

      # 6. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/**/*.apk
