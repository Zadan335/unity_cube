name: Unity Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Debug (optional but useful)
      - name: Debug Workspace
        run: |
          pwd
          ls -la
          ls Assets Packages ProjectSettings || echo "Not Unity project"

      # 3. Build using LOCAL Unity (NO LOGIN)
      - name: Build Android with Local Unity
        run: |
          /Applications/Unity/Hub/Editor/2022.3.62f3/Unity.app/Contents/MacOS/Unity \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod BuildScript.BuildAndroid \
            -quit \
            -logFile unity_build.log

      # 4. Upload logs
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: unity_build.log

      # 5. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/**/*.apk
