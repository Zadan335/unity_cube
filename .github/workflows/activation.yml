name: Unity Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Debug workspace
      - name: Debug Workspace
        run: |
          pwd
          ls -la
          ls Assets Packages ProjectSettings || echo "Not a Unity project"

      # 3. Locate Unity safely
      - name: Locate Unity
        id: unity
        run: |
          UNITY_PATH=$(find /Applications/Unity/Hub/Editor -type f -name Unity | grep "/MacOS/Unity" | head -n 1)

          if [ -z "$UNITY_PATH" ]; then
            echo "❌ Unity not found"
            exit 1
          fi

          echo "UNITY_PATH=$UNITY_PATH" >> $GITHUB_ENV
          echo "✅ Found Unity at: $UNITY_PATH"

      # 4. Make sure Unity is executable
      - name: Fix permissions
        run: |
          chmod +x "$UNITY_PATH"

      # 5. Build Android (Rosetta Intel mode if required)
      - name: Build Android
        run: |
          arch -x86_64 "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod BuildScript.BuildAndroid \
            -quit \
            -logFile unity_build.log

      # 6. Upload Unity logs
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: unity_build.log

      # 7. Find APK safely
      - name: Locate APK
        run: |
          find . -name "*.apk" > apk_list.txt
          cat apk_list.txt

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/*.apk
