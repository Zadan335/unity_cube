name: Unity License Activation Test

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest

    container:
      image: unityci/editor:ubuntu-2022.3.59f1-android-3.1.0

    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Verify Unity Exists
        run: |
          which unity-editor
          unity-editor -version

      - name: Activate Unity License
        run: |
          echo "$UNITY_LICENSE" > Unity_lic.ulf

          mkdir -p /root/.local/share/unity3d/Unity
          mv Unity_lic.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf

          unity-editor \
            -batchmode \
            -nographics \
            -manualLicenseFile /root/.local/share/unity3d/Unity/Unity_lic.ulf \
            -quit

      - name: Activation Success
        run: echo "Unity activated successfully"
