name: Unity Android CI (Builder)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macOS]

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Cache Library (important)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3. Unity Builder (MAIN STEP)
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}   # not required if Mac already activated, but safe
        with:
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          androidExportType: androidPackage

      # 4. Upload build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android
