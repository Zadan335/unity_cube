name: Unity Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Debug Workspace
      - name: Debug Workspace
        run: |
          echo "WORKDIR:"
          pwd
          echo "FILES:"
          ls -la
          echo "UNITY PROJECT CHECK:"
          ls Assets Packages ProjectSettings || echo "❌ NOT UNITY ROOT"

      # 3. Cache Unity Library
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 4. Build Android (Unity Builder)
      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ github.workspace }}
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid

      # 5. Upload Unity Logs
      - name: Upload Unity Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: |
            build.log
            Unity.log
            unity_build.log

      # 6. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/android/**/*.apk
