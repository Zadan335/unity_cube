name: Unity Android Build (2022.3 LTS ARM)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    env:
      UNITY_PATH: /Applications/Unity/Hub/Editor/2022.3.62f3/Unity.app/Contents/MacOS/Unity
      PROJECT_PATH: ${{ github.workspace }}

    steps:
      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # 2. Debug
      # -------------------------
      - name: Debug Workspace
        run: |
          pwd
          ls -la
          file "$UNITY_PATH"

      # -------------------------
      # 3. Fix permissions
      # -------------------------
      - name: Fix Permissions
        run: |
          sudo chown -R $(whoami) .
          chmod -R u+rw .

      # -------------------------
      # 4. Clean SAFE Unity cache only
      # -------------------------
      - name: Clean Unity Cache (Safe)
        run: |
          rm -rf Library/ArtifactDB
          rm -rf Library/Bee
          rm -rf Temp
          rm -rf Obj

      # -------------------------
      # 5. TMPDIR fix (IMPORTANT for Burst/IL2CPP)
      # -------------------------
      - name: Setup TMPDIR
        run: |
          mkdir -p /tmp/unity
          echo "TMPDIR=/tmp/unity" >> $GITHUB_ENV

      # -------------------------
      # 6. Free memory (prevents SIGKILL 137)
      # -------------------------
      - name: Memory Cleanup
        run: |
          sudo purge || true

      # -------------------------
      # 7. Build Android
      # -------------------------
      - name: Build Android APK
        run: |
          "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -projectPath "$PROJECT_PATH" \
            -executeMethod BuildScript.BuildAndroid \
            -logFile unity_build.log \
            -quit \
            -stackTraceLogType Full \
            -silent-crashes \
            -disable-assembly-updater

      # -------------------------
      # 8. Upload logs
      # -------------------------
      - name: Upload Unity Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: unity_build.log

      # -------------------------
      # 9. Find APK safely
      # -------------------------
      - name: Find APK
        run: |
          find . -name "*.apk"

      # -------------------------
      # 10. Upload APK
      # -------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/*.apk
