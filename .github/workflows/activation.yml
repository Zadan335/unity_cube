name: Unity Android Build (ARM Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    env:
      UNITY_PATH: /Applications/Unity/Hub/Editor/6000.3.15f1/Unity.app/Contents/MacOS/Unity
      PROJECT_PATH: ${{ github.workspace }}
      TMPDIR: /tmp/unity

    steps:
      # 1. Checkout project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Debug workspace (optional but useful)
      - name: Debug Workspace
        run: |
          pwd
          ls -la
          echo "Unity Path: $UNITY_PATH"

      # 3. Fix permissions (important for cloned projects)
      - name: Fix Permissions
        run: |
          sudo chown -R $(whoami) .
          chmod -R u+rw .

      # 4. Clean Unity generated folders (prevents Burst/Library corruption)
      - name: Clean Unity Cache
        run: |
          rm -rf Library
          rm -rf Temp
          rm -rf Obj

      # 5. Ensure safe temp directory (fixes Burst permission issues)
      - name: Setup TMPDIR
        run: |
          mkdir -p /tmp/unity
          export TMPDIR=/tmp/unity

      # 6. Run Unity Build (NO arch -x86_64)
      - name: Build Android APK
        run: |
          "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -projectPath "$PROJECT_PATH" \
            -executeMethod BuildScript.BuildAndroid \
            -quit \
            -logFile unity_build.log

      # 7. Upload logs (very important for debugging)
      - name: Upload Unity Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: unity_build.log

      # 8. Upload APK (adjust path if needed)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: Builds/*.apk
