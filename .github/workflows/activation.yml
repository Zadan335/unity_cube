name: Unity Android Build (ARM Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: [self-hosted, macOS]

    env:
      UNITY_PATH: /Applications/Unity/Hub/Editor/6000.3.15f1f1/Unity.app/Contents/MacOS/Unity
      PROJECT_PATH: ${{ github.workspace }}
      TMPDIR: /tmp/unity

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Debug
      - name: Debug Workspace
        run: |
          pwd
          ls -la
          echo "Unity Path: $UNITY_PATH"
          file "$UNITY_PATH"

      # 3. Fix permissions (important for self-hosted runners)
      - name: Fix Permissions
        run: |
          sudo chown -R $(whoami) .
          chmod -R u+rw .

      # 4. Clean ONLY unsafe Unity cache (DON'T overdelete in CI)
      - name: Clean Unity Cache
        run: |
          rm -rf Library/ArtifactDB
          rm -rf Temp/
          rm -rf Obj/

      # 5. Setup safe temp dir (IMPORTANT for Burst + IL2CPP)
      - name: Setup TMPDIR
        run: |
          mkdir -p /tmp/unity
          echo "TMPDIR=/tmp/unity" >> $GITHUB_ENV

      # 6. Free memory before Unity starts (prevents SIGKILL 9)
      - name: Memory Cleanup
        run: |
          sudo purge || true

      # 7. Build Android
      - name: Build Android APK
        run: |
          "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -projectPath "$PROJECT_PATH" \
            -executeMethod BuildScript.BuildAndroid \
            -logFile unity_build.log \
            -quit \
            -stackTraceLogType Full \
            -silent-crashes \
            -disable-assembly-updater

      # 8. Upload logs always
      - name: Upload Unity Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: unity_build.log

      # 9. Find APK safely (DON'T assume path)
      - name: Find APK
        run: |
          find . -name "*.apk" > apk_list.txt
          cat apk_list.txt

      # 10. Upload APK (robust)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/*.apk
